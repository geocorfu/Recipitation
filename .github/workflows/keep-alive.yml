# Backup for the daily Vercel job: a second, independent trigger for /api/cron.
# Needs the repo secret CRON_SECRET, the same value as in Vercel.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run the daily job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl --silent --show-error --fail --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://recipitation.vercel.app/api/cron)
          echo "$response"
          echo "$response" | grep -q '"heartbeat":"written"'
